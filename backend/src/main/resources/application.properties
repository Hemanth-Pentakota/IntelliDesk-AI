spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/intellidesk_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Application name
spring.application.name=intellidesk-backend

